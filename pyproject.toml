[project]
name = "doc-query"
version = "0.1.0"
description = "Local, index-and-search retrieval over office documents (PDF today; pptx/xlsx planned) that returns small relevant snippets instead of full text, to minimize LLM context/token consumption."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7.0"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docq*"]
