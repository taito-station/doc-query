[project]
name = "pdf-query"
version = "0.1.0"
description = "Local, index-and-search retrieval over PDF files that returns small relevant snippets instead of full text, to minimize LLM context/token consumption."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
bm25 = ["rank_bm25>=0.2.2"]
tokens = ["tiktoken>=0.7.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdfq*"]
