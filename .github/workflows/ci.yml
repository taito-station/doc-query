name: CI

on:
  pull_request:
  push:
    branches: [main]

# 読み取りだけで足りる。書き込み権限を既定で与えない。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python }} / ${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # tiktoken 無しのフォールバック経路（chars/4 近似）も回す。
          # optional 依存なので、そちらだけが壊れる変更を検出できるようにする。
          - python: "3.10"
            extras: "dev"
          - python: "3.13"
            extras: "tokens,dev"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest tests -q

  docs:
    name: 文書の機械検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # stale 検査が git log と merge-base を使う。shallow clone では
          # 判定できず、それを「変更なし」と読むのは fail-open になる。
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # 検査自身の回帰テストを先に走らせる。本番検査が先だと、落ちた瞬間に
      # 判定器がまともかどうかを確かめる手段を同時に失う。
      - name: 検査スクリプト自身の回帰テスト
        run: |
          python3 scripts/test-check-doc-classes.py
          python3 scripts/test-check-decision-log-immutability.py
          python3 scripts/test-check-no-pdf-committed.py

      - name: 文書クラス・REQ 表・決定ログの検査
        run: python3 scripts/check-doc-classes.py

      - name: 決定ログの append-only 検査
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            # push（main への直接・マージ後）で base を origin/main にすると、
            # merge-base が HEAD 自身になり「自分と自分」を比べて必ず通る。
            # 静かな fail-open なので、直前のコミットと比べる。
            base="HEAD^"
          fi
          python3 scripts/check-decision-log-immutability.py --base "$base"

      - name: 実物の文書・生成物の混入検査
        run: python3 scripts/check-no-pdf-committed.py
